<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>非车险政策宣导完整手册</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="policy-page">
    <div id="authGate" class="auth-gate" role="dialog" aria-labelledby="authTitle" aria-modal="true">
      <form id="authForm" class="auth-panel">
        <img class="auth-logo" src="logo-insurance.png" alt="懂财险" />
        <p class="eyebrow">Private access</p>
        <h2 id="authTitle">非车险政策宣导完整手册</h2>
        <p class="auth-copy">请输入账号和密码后继续访问。</p>
        <label>
          <span>账号</span>
          <input id="authUser" type="text" autocomplete="username" required />
        </label>
        <label>
          <span>密码</span>
          <input id="authPass" type="password" autocomplete="current-password" required />
        </label>
        <p id="authError" class="auth-error" aria-live="polite"></p>
        <button type="submit">进入手册</button>
      </form>
    </div>

    <header class="topbar manual-topbar">
      <div class="brand-title">
        <img class="brand-logo" src="logo-insurance.png" alt="懂财险" />
        <div>
          <p class="eyebrow">Policy knowledge manual</p>
          <h1>非车险政策知识手册</h1>
          <p class="topbar-copy">作者：毛宁</p>
        </div>
      </div>
      <div class="toolbar">
        <label class="search">
          <span>搜索全文</span>
          <input id="policySearch" type="search" placeholder="输入险种、条款、承保政策、风险要素..." />
        </label>
        <button id="navToggleBtn" type="button">目录</button>
        <button id="resetBtn" type="button">清空筛选</button>
        <button id="backTopBtn" type="button">返回顶部</button>
        <button id="printBtn" type="button">打印/导出 PDF</button>
      </div>
    </header>

    <div class="manual-layout">
      <aside id="manualSidebar" class="manual-sidebar">
        <div class="nav-title">目录</div>
        <nav id="policyNav" class="manual-nav" aria-label="完整政策目录"></nav>
      </aside>

      <main class="manual-main">
        <section id="chapterSection" class="section">
          <div class="section-head">
            <div>
              <h2>一级章节</h2>
            </div>
          </div>
          <div id="chapterGrid" class="chapter-grid" aria-label="一级章节"></div>
        </section>

        <section id="moduleSection" class="section">
          <div class="section-head">
            <div>
              <h2>二级模块</h2>
            </div>
          </div>
          <div id="moduleGrid" class="module-grid" aria-label="二级目录模块"></div>
        </section>

        <section id="cardSection" class="section">
          <div class="section-head">
            <div>
              <h2>主题卡片</h2>
            </div>
            <span class="count-pill"><b id="cardCount">0</b> 张卡片</span>
          </div>
          <div id="filterBar" class="filter-bar" aria-label="内容标签筛选"></div>
          <div id="moduleIntro" class="module-intro-blocks"></div>
          <div id="knowledgeGrid" class="knowledge-grid" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <dialog id="detailModal" class="detail-modal" aria-labelledby="modalTitle">
      <div class="modal-shell">
        <header class="modal-header">
          <div>
            <p id="modalMeta" class="eyebrow"></p>
            <h2 id="modalTitle"></h2>
            <div id="modalTags" class="tag-row"></div>
          </div>
          <button id="modalClose" type="button" aria-label="关闭弹窗">关闭</button>
        </header>
        <div id="modalBody" class="modal-body"></div>
        <footer class="modal-actions">
          <button id="prevCardBtn" type="button">上一条</button>
          <button id="nextCardBtn" type="button">下一条</button>
        </footer>
      </div>
    </dialog>

    <footer>
      <p>作者：毛宁 · 完整政策宣导网页手册</p>
    </footer>

    <script src="manual-data.js"></script>
    <script src="policy-full.js"></script>
  </body>
</html>
